<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="120" fill="url(#grad1)"/>
  
  <!-- 图标主体 - 图表和文档组合 -->
  <!-- 文档 -->
  <rect x="120" y="140" width="200" height="260" rx="20" fill="white" opacity="0.9"/>
  <line x1="160" y1="200" x2="280" y2="200" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="280" y2="240" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="160" y1="280" x2="240" y2="280" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 图表 -->
  <circle cx="380" cy="200" r="80" fill="white" opacity="0.9"/>
  <path d="M 340 220 L 360 180 L 380 200 L 400 160 L 420 180" 
        stroke="#7c3aed" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 加号装饰 -->
  <circle cx="200" cy="350" r="25" fill="#fbbf24"/>
  <line x1="200" y1="335" x2="200" y2="365" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="185" y1="350" x2="215" y2="350" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
