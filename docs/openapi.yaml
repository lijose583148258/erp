openapi: 3.1.0
info:
  title: AilaoDa ERP/CRM API
  version: 0.1.0
  description: >
    Seed OpenAPI contract for the current ERP/CRM API surface. This file is
    intentionally partial: it documents the active route families and a small
    set of high-value endpoints first, then must be expanded module by module
    before it is treated as the authoritative generated API contract.
  x-contract-status: seed
  x-contract-owner: engineering-readiness
  x-source-evidence:
    - backend/src/server.ts
    - backend/src/routes/auth.routes.ts
    - backend/src/routes/dashboard.routes.ts
    - backend/src/routes/customer.routes.ts
    - backend/src/routes/order.routes.ts
servers:
  - url: http://127.0.0.1:5001
    description: Local stable runtime
tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Customers
  - name: Orders
  - name: Collections
  - name: Procurement
  - name: Warehouse
  - name: Production
  - name: Finance
  - name: Commercial
  - name: Audit
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Runtime health check
      security: []
      responses:
        '200':
          description: Runtime is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Runtime is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health:
    $ref: '#/paths/~1api~1health'
  /api/ready:
    get:
      tags: [Health]
      summary: Readiness probe including database connectivity
      security: []
      responses:
        '200':
          description: Runtime is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Runtime is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/ready:
    $ref: '#/paths/~1api~1ready'
  /api/livez:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Runtime is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'
  /api/v1/livez:
    $ref: '#/paths/~1api~1livez'
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus text metrics endpoint
      security: []
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue access credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    $ref: '#/paths/~1api~1auth~1login'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Return the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    $ref: '#/paths/~1api~1auth~1me'
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard summary cards and operational counts
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/dashboard:
    $ref: '#/paths/~1api~1dashboard'
  /api/dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Dashboard trend series
      responses:
        '200':
          description: Dashboard trend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/dashboard/trends:
    $ref: '#/paths/~1api~1dashboard~1trends'
  /api/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Customers]
      summary: Create a customer
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/customers:
    $ref: '#/paths/~1api~1customers'
  /api/orders:
    get:
      tags: [Orders]
      summary: List sales orders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Orders]
      summary: Create a sales order
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/orders:
    $ref: '#/paths/~1api~1orders'
  /api/collections/summary:
    get:
      tags: [Collections]
      summary: Collections summary
      responses:
        '200':
          description: Collections summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/collections/summary:
    $ref: '#/paths/~1api~1collections~1summary'
  /api/procurement/orders:
    get:
      tags: [Procurement]
      summary: List purchase orders
      responses:
        '200':
          description: Purchase order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/procurement/orders:
    $ref: '#/paths/~1api~1procurement~1orders'
  /api/warehouses/stock-balances:
    get:
      tags: [Warehouse]
      summary: List stock balances
      responses:
        '200':
          description: Stock balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/warehouses/stock-balances:
    $ref: '#/paths/~1api~1warehouses~1stock-balances'
  /api/production/summary:
    get:
      tags: [Production]
      summary: Production summary
      responses:
        '200':
          description: Production summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/production/summary:
    $ref: '#/paths/~1api~1production~1summary'
  /api/finance/summary:
    get:
      tags: [Finance]
      summary: Finance summary
      responses:
        '200':
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/finance/summary:
    $ref: '#/paths/~1api~1finance~1summary'
  /api/commercial/readiness:
    get:
      tags: [Commercial]
      summary: Commercial platform readiness
      responses:
        '200':
          description: Commercial readiness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/commercial/readiness:
    $ref: '#/paths/~1api~1commercial~1readiness'
  /api/audit:
    get:
      tags: [Audit]
      summary: List audit events
      responses:
        '200':
          description: Audit event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/audit:
    $ref: '#/paths/~1api~1audit'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        token:
          type: string
        data:
          nullable: true
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        database:
          type: string
        timestamp:
          type: string
          format: date-time
    LivezResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
