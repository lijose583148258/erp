version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ailao-erp-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailaoda}
      POSTGRES_USER: ${POSTGRES_USER:-ailaoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set before server deploy}
    volumes:
      - ailao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ailao-app:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: ailao-erp-crm:postgres
    container_name: ailao-erp-crm-postgres-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AILAODA_HTTP_PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      AILAODA_DEPLOYMENT_MODE: saas
      AILAODA_PRISMA_PROVIDER: postgresql
      PORT: 5001
      SERVE_FRONTEND: "true"
      TRUST_PROXY: "true"
      FRONTEND_DIST_DIR: /app/dist
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ailaoda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ailaoda}?schema=public}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      LOG_DIR: ${LOG_DIR:-/data/logs}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      BACKUP_RETENTION_MODE: ${BACKUP_RETENTION_MODE:-report-only}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-800}
      BACKUP_MAX_TOTAL_MB: ${BACKUP_MAX_TOTAL_MB:-8192}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set before server deploy}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5001,http://localhost:5001}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-2000}
    volumes:
      - ailao-runtime-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ailao-postgres-data:
  ailao-runtime-data:
