version: '3.8'

# PostgreSQL integration and migration rehearsal topology.
# This file intentionally starts only the database service. The current app
# image is still a SQLite Prisma artifact and must not be pointed at this
# DATABASE_URL until a PostgreSQL-specific server artifact is built.

services:
  postgres:
    image: postgres:16-bookworm
    container_name: ailao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailaoda}
      POSTGRES_USER: ${POSTGRES_USER:-ailaoda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set before PostgreSQL rehearsal}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ailao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ailao-postgres-data:
