name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build

      - name: Default credential release gate
        run: npm run audit:auth:default-credentials

      - name: Refactor freeze gate
        run: npm run audit:refactor:freeze

      - name: Frontend unit tests
        run: npm run test:unit:frontend

      - name: Backend unit tests
        run: npm --prefix backend test -- --runInBand

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-evidence
          path: |
            output/audit/
            backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  enterprise-cloud-sandbox:
    name: Enterprise cloud sandbox
    uses: ./.github/workflows/enterprise-cloud-sandbox.yml
