name: CI

on:
  push:
    branches:
      - main
      - codex/release-usability-freeze-20260608
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - codex/release-usability-freeze-20260608
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../runtime-data/ci.db
      AILAODA_RUNTIME_DB_PATH: runtime-data/ci.db
      AILAODA_ALLOW_RBAC_FALLBACK: "1"
      BROWSER_GUARD_SKIP_PROBE: "1"
      npm_config_loglevel: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --silent

      - name: Install backend dependencies
        run: npm --prefix backend ci --silent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck frontend
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build

      - name: Prepare CI database
        run: |
          mkdir -p backend/runtime-data
          rm -f backend/runtime-data/ci.db backend/runtime-data/ci-init.sql
          cd backend
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma --script > runtime-data/ci-init.sql
          npx prisma db execute --schema prisma --file runtime-data/ci-init.sql
          cd ..
          npm --prefix backend run db:prepare

      - name: Start CI runtime
        run: |
          npm --prefix backend run start > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5001/api/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat backend-ci.log
          exit 1

      - name: Release gates
        run: npm run test
