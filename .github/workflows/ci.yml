name: CI

on:
  push:
    branches:
      - main
      - codex/release-usability-freeze-20260608
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - codex/release-usability-freeze-20260608
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      npm_config_loglevel: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --silent

      - name: Install backend dependencies
        run: npm --prefix backend ci --silent

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck frontend
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build

      - name: Static release gates
        run: npm run test
