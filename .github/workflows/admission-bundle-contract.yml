name: Admission bundle contract

on:
  pull_request:
    paths:
      - 'ops/production/kubernetes/run-enterprise-production-admission.cjs'
      - 'ops/production/kubernetes/verify-formal-pilot-preflight-evidence.cjs'
      - 'ops/production/kubernetes/verify-enterprise-production-admission.sh'
      - 'ops/production/kubernetes/failure-domain-evidence.example.json'
      - 'ops/production/kubernetes/admission-bundle.example.json'
      - 'ops/production/kubernetes/verify-formal-pilot-provider-profile.cjs'
      - 'ops/production/kubernetes/formal-pilot-provider-profile.example.json'
      - '.github/workflows/admission-bundle-contract.yml'
      - 'ops/production/kubernetes/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-bundle-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundle and reject path escape
        shell: bash
        run: |
          node --check ops/production/kubernetes/run-enterprise-production-admission.cjs
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');

          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'admission-bundle-'));
          const identity = {
            environment: 'formal-pilot',
            evidenceId: 'CHG-12345',
            commitSha: 'a'.repeat(40),
            imageDigest: `sha256:${'b'.repeat(64)}`,
          };
          const release = { ...identity };
          const providerProfile = {
            schemaVersion: 1,
            environment: 'formal-pilot',
            platform: {
              kind: 'kubernetes-native',
              failureDomains: ['zone-a', 'zone-b', 'zone-c'],
              applicationNamespace: 'ailaoda-pilot',
              recoveryNamespace: 'ailaoda-pilot-recovery',
            },
            adapters: {
              postgres: { fileName: 'cnpg-ha-adapter.cjs', sha256: 'a'.repeat(64) },
              redis: { fileName: 'redis-kubernetes-ha-adapter.cjs', sha256: 'b'.repeat(64) },
              objectStorage: { fileName: 'minio-kubernetes-object-adapter.cjs', sha256: 'c'.repeat(64) },
              search: { fileName: 'meilisearch-kubernetes-search-adapter.cjs', sha256: 'd'.repeat(64) },
              backup: { fileName: 'cnpg-backup-adapter.cjs', sha256: 'e'.repeat(64) },
              observability: { fileName: 'tempo-alert-receipt-adapter.cjs', sha256: 'f'.repeat(64) },
            },
            postgresql: {
              kind: 'cloudnativepg', instances: 3, haAdapter: 'cnpg-ha-adapter.cjs',
              backup: {
                method: 'barman-object-store', encrypted: true,
                checksumEvidence: 'barman-manifest', isolatedRestore: true,
                receiptVerifier: {
                  mode: 'ed25519-provider-signed',
                  issuer: 'provider-backup-control-plane',
                  publicKeySha256: '1'.repeat(64),
                  serviceFileName: 'cnpg-backup-receipt-service.cjs',
                  serviceSha256: '2'.repeat(64),
                },
              },
            },
            redis: {
              kind: 'sentinel', dataInstances: 3, sentinelCount: 3,
              haAdapter: 'redis-kubernetes-ha-adapter.cjs',
            },
            objectStorage: {
              kind: 'minio-distributed', dataPods: 4,
              haAdapter: 'minio-kubernetes-object-adapter.cjs', pvcDeletePermission: false,
            },
            search: {
              kind: 'meilisearch', servingInstances: 2,
              backupMethod: 'csi-volume-snapshot', isolatedRestore: true,
              restoreNamespace: 'ailaoda-pilot-recovery',
            },
            observability: {
              traceBackend: 'tempo', alertRoute: 'pilot-operations',
              deliveryReceiptStore: 'webhook-audit-store',
            },
            ai: { mode: 'local-only', externalGateway: false, paidCallBudget: 0 },
            observation: { continuousHours: 8, pilotDays: 7, collectorImageDigest: `sha256:${'e'.repeat(64)}` },
          };
          const providerProfileText = JSON.stringify(providerProfile);
          identity.providerProfile = {
            status: 'passed',
            environment: identity.environment,
            sha256: crypto.createHash('sha256').update(providerProfileText).digest('hex'),
            verifiedAt: '2026-07-15T00:00:00Z',
          };
          const adapterSha256 = Object.fromEntries(
            Object.entries(providerProfile.adapters).map(([name, binding]) => [name, binding.sha256]),
          );
          identity.haDrill = {
            status: 'passed',
            environment: identity.environment,
            changeTicket: identity.evidenceId,
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: {
              postgres: adapterSha256.postgres,
              redis: adapterSha256.redis,
            },
          };
          const backupReport = {
            status: 'passed',
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { backup: adapterSha256.backup },
          };
          identity.backupDrill = {
            status: 'passed',
            environment: identity.environment,
            changeTicket: identity.evidenceId,
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { backup: adapterSha256.backup },
          };
          const objectStorageReport = {
            status: 'passed',
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { objectStorage: adapterSha256.objectStorage },
          };
          const searchFailoverReport = {
            status: 'passed',
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { search: adapterSha256.search },
          };
          const searchRestoreReport = {
            status: 'passed',
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { search: adapterSha256.search },
          };
          identity.storageSearchDrill = {
            status: 'passed',
            environment: identity.environment,
            evidenceId: identity.evidenceId,
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: {
              objectStorage: adapterSha256.objectStorage,
              search: adapterSha256.search,
            },
          };
          const observabilityReport = {
            status: 'passed',
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { observability: adapterSha256.observability },
          };
          identity.observabilityDrill = {
            status: 'passed',
            environment: identity.environment,
            changeTicket: identity.evidenceId,
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256: { observability: adapterSha256.observability },
          };
          const requiredChecks = [
            'provider-profile-bound', 'all-adapters-profile-bound', 'all-adapters-executable',
            'backup-receipt-verifier-bound-and-healthy',
            'postgres-provider-topology', 'postgres-preferred-endpoint',
            'redis-provider-topology', 'redis-preferred-endpoint',
            'objectStorage-provider-topology', 'objectStorage-preferred-endpoint',
            'search-provider-topology', 'search-preferred-endpoint',
            'two-distinct-application-instances', 'least-privilege-audit-login',
            'cross-instance-session-readback', 'application-search-marker',
            'provider-search-marker-readback',
          ].map(name => ({ name, status: 'passed' }));
          const now = new Date().toISOString();
          const preflightReport = {
            name: 'Formal Pilot Read-Only Environment Preflight',
            version: '1.0',
            status: 'passed',
            mode: 'read-only',
            ...release,
            providerProfileSha256: identity.providerProfile.sha256,
            adapterSha256,
            backupReceiptVerifier: { ...providerProfile.postgresql.backup.receiptVerifier },
            startedAt: now,
            finishedAt: now,
            topology: {
              postgresFailureDomains: 2,
              redisFailureDomains: 3,
              redisSentinelCount: 3,
              objectStorageFailureDomains: 2,
              searchFailureDomains: 2,
            },
            checks: [
              ...requiredChecks,
              { name: 'application-health-and-readiness', status: 'passed' },
              { name: 'application-health-and-readiness', status: 'passed' },
            ],
          };
          const artifacts = {
            evidence: 'evidence/enterprise-evidence.json',
            providerProfile: 'provider/profile.json',
            preflightReport: 'preflight/report.json',
            continuousReport: 'observation/continuous.json',
            pilotLedger: 'observation/ledger.json',
            dailyReportsDir: 'observation/daily',
            backupReport: 'backup/report.json',
            resilienceReportsDir: 'resilience',
            observabilityReport: 'observability/report.json',
            loadReconciliationReportsDir: 'load',
            aiReportsDir: 'ai',
            securityReportsDir: 'security',
          };
          for (const [key, relative] of Object.entries(artifacts)) {
            const target = path.join(root, relative);
            if (key.endsWith('Dir')) {
              fs.mkdirSync(target, { recursive: true });
            } else {
              fs.mkdirSync(path.dirname(target), { recursive: true });
              const value = key === 'evidence' ? identity
                : key === 'providerProfile' ? providerProfile
                  : key === 'preflightReport' ? preflightReport
                    : key === 'backupReport' ? backupReport
                      : key === 'observabilityReport' ? observabilityReport : {};
              fs.writeFileSync(target, JSON.stringify(value));
            }
          }
          const resilienceRoot = path.join(root, artifacts.resilienceReportsDir);
          fs.writeFileSync(path.join(resilienceRoot, 'object-storage-failover-audit-v1.json'), JSON.stringify(objectStorageReport));
          fs.writeFileSync(path.join(resilienceRoot, 'meilisearch-failover-audit-v1.json'), JSON.stringify(searchFailoverReport));
          fs.writeFileSync(path.join(resilienceRoot, 'meilisearch-dump-restore-audit-v1.json'), JSON.stringify(searchRestoreReport));
          const manifest = {
            schemaVersion: 1,
            namespace: 'ailaoda-pilot',
            release,
            artifacts,
          };
          const manifestPath = path.join(root, 'admission-bundle.json');
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const runner = path.resolve('ops/production/kubernetes/run-enterprise-production-admission.cjs');
          const run = () => spawnSync(process.execPath, [runner, '--bundle', manifestPath, '--check-only'], { encoding: 'utf8' });

          const valid = run();
          if (valid.status !== 0) throw new Error(valid.stderr || valid.stdout || 'Valid bundle was rejected.');
          manifest.artifacts.backupReport = '../outside.json';
          fs.writeFileSync(path.join(path.dirname(root), 'outside.json'), '{}');
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const escaped = run();
          if (escaped.status === 0) throw new Error('Bundle path traversal was accepted.');

          manifest.artifacts.backupReport = artifacts.backupReport;
          preflightReport.adapterSha256.search = '0'.repeat(64);
          fs.writeFileSync(path.join(root, artifacts.preflightReport), JSON.stringify(preflightReport));
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const tamperedPreflight = run();
          if (tamperedPreflight.status === 0) throw new Error('Tampered preflight adapter hash was accepted.');
          preflightReport.adapterSha256.search = providerProfile.adapters.search.sha256;
          fs.writeFileSync(path.join(root, artifacts.preflightReport), JSON.stringify(preflightReport));

          preflightReport.backupReceiptVerifier.publicKeySha256 = '0'.repeat(64);
          fs.writeFileSync(path.join(root, artifacts.preflightReport), JSON.stringify(preflightReport));
          const tamperedReceiptTrust = run();
          if (tamperedReceiptTrust.status === 0) throw new Error('Tampered receipt trust was accepted.');
          preflightReport.backupReceiptVerifier.publicKeySha256 =
            providerProfile.postgresql.backup.receiptVerifier.publicKeySha256;
          fs.writeFileSync(path.join(root, artifacts.preflightReport), JSON.stringify(preflightReport));

          identity.haDrill.adapterSha256.redis = '0'.repeat(64);
          fs.writeFileSync(path.join(root, artifacts.evidence), JSON.stringify(identity));
          const tamperedHaAdapter = run();
          if (tamperedHaAdapter.status === 0) throw new Error('Tampered HA adapter hash was accepted.');
          identity.haDrill.adapterSha256.redis = providerProfile.adapters.redis.sha256;
          fs.writeFileSync(path.join(root, artifacts.evidence), JSON.stringify(identity));

          backupReport.adapterSha256.backup = '0'.repeat(64);
          fs.writeFileSync(path.join(root, artifacts.backupReport), JSON.stringify(backupReport));
          const tamperedBackupAdapter = run();
          if (tamperedBackupAdapter.status === 0) throw new Error('Tampered backup adapter hash was accepted.');
          backupReport.adapterSha256.backup = providerProfile.adapters.backup.sha256;
          fs.writeFileSync(path.join(root, artifacts.backupReport), JSON.stringify(backupReport));

          searchRestoreReport.adapterSha256.search = '0'.repeat(64);
          fs.writeFileSync(path.join(resilienceRoot, 'meilisearch-dump-restore-audit-v1.json'), JSON.stringify(searchRestoreReport));
          const tamperedSearchAdapter = run();
          if (tamperedSearchAdapter.status === 0) throw new Error('Tampered search adapter hash was accepted.');
          searchRestoreReport.adapterSha256.search = providerProfile.adapters.search.sha256;
          fs.writeFileSync(path.join(resilienceRoot, 'meilisearch-dump-restore-audit-v1.json'), JSON.stringify(searchRestoreReport));

          observabilityReport.adapterSha256.observability = '0'.repeat(64);
          fs.writeFileSync(path.join(root, artifacts.observabilityReport), JSON.stringify(observabilityReport));
          const tamperedObservabilityAdapter = run();
          if (tamperedObservabilityAdapter.status === 0) throw new Error('Tampered observability adapter hash was accepted.');
          observabilityReport.adapterSha256.observability = providerProfile.adapters.observability.sha256;
          fs.writeFileSync(path.join(root, artifacts.observabilityReport), JSON.stringify(observabilityReport));

          providerProfile.environment = 'different-pilot';
          fs.writeFileSync(path.join(root, artifacts.providerProfile), JSON.stringify(providerProfile));
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const mismatchedProvider = run();
          if (mismatchedProvider.status === 0) throw new Error('Mismatched provider environment was accepted.');
          console.log('Admission bundle contract: PASSED');
          NODE
