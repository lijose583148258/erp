name: Security evidence contract

on:
  pull_request:
    paths:
      - 'scripts/run-security-production-readiness-v1.cjs'
      - 'scripts/default-credential-release-gate-v1.cjs'
      - 'ops/production/kubernetes/verify-security-evidence.cjs'
      - 'ops/production/kubernetes/verify-enterprise-production-admission.sh'
      - '.github/workflows/security-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-evidence-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax checks
        run: |
          node --check scripts/run-security-production-readiness-v1.cjs
          node --check scripts/default-credential-release-gate-v1.cjs
          node --check ops/production/kubernetes/verify-security-evidence.cjs
          bash -n ops/production/kubernetes/verify-enterprise-production-admission.sh
      - name: Verify security binding and tamper rejection
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');

          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'security-evidence-'));
          const evidencePath = path.join(dir, 'evidence.json');
          const identity = {
            environment: 'formal-pilot',
            evidenceId: 'CHG-12345',
            commitSha: 'a'.repeat(40),
            imageDigest: `sha256:${'b'.repeat(64)}`,
          };
          const generatedAt = new Date(Date.now() - 1_000).toISOString();
          const digest = crypto.createHash('sha256').update('').digest('hex');
          const readiness = {
            status: 'passed', ...identity, generatedAt, failedStep: null,
            steps: ['csp', 'csrf-boundary', 'mfa', 'secrets', 'distributed-auth', 'dependencies']
              .map(id => ({
                id, status: 'passed', exitCode: 0, stdoutBytes: 0, stderrBytes: 0,
                stdoutSha256: digest, stderrSha256: digest,
              })),
          };
          const credentials = {
            name: 'Default Credential Release Gate', version: '2.0',
            status: 'passed', ...identity, generatedAt, strictMode: true,
            results: ['admin', 'manager', 'sales', 'warehouse', 'finance']
              .map(username => ({
                username, accepted: false, businessAccess: false,
                transportVerified: true, explicitRejection: true, statusCode: 401,
              })),
            findings: [],
          };
          const readinessPath = path.join(dir, 'security-production-readiness-v1.json');
          const credentialsPath = path.join(dir, 'default-credential-release-gate-v1.json');
          fs.writeFileSync(readinessPath, `${JSON.stringify(readiness, null, 2)}\n`);
          fs.writeFileSync(credentialsPath, `${JSON.stringify(credentials, null, 2)}\n`);
          fs.writeFileSync(evidencePath, `${JSON.stringify(identity, null, 2)}\n`);

          const verifier = path.resolve('ops/production/kubernetes/verify-security-evidence.cjs');
          const run = extra => spawnSync(process.execPath, [
            verifier, '--reports-dir', dir, '--evidence', evidencePath, ...extra,
          ], { encoding: 'utf8' });
          const bound = run(['--bind']);
          if (bound.status !== 0) throw new Error(bound.stderr || bound.stdout || 'Binding failed.');
          const valid = run([]);
          if (valid.status !== 0) throw new Error(valid.stderr || valid.stdout || 'Valid evidence was rejected.');

          credentials.results[0].transportVerified = false;
          credentials.results[0].explicitRejection = false;
          credentials.results[0].statusCode = null;
          fs.writeFileSync(credentialsPath, `${JSON.stringify(credentials, null, 2)}\n`);
          const tampered = run([]);
          if (tampered.status === 0) throw new Error('Inconclusive default credential probe was accepted.');
          console.log('Security evidence contract: PASSED');
          NODE
