global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ailao-app
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ailaoda_metrics_bearer_token
    static_configs:
      - targets:
          - ailao-app:5001
        labels:
          service: ailao-erp-crm
          runtime: docker-compose
