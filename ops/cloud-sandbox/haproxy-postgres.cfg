global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

listen postgres
  bind *:5432
  option tcp-check
  tcp-check connect
  server primary postgres:5432 check inter 1s fall 2 rise 2
  server replica postgres-replica:5432 check inter 1s fall 2 rise 2 backup
