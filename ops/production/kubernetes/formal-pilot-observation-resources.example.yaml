apiVersion: v1
kind: ConfigMap
metadata:
  name: ailaoda-pilot-observation
data:
  environment: replace-with-formal-pilot
  evidence-id: replace-with-change-ticket
  app-urls: https://app-a.example,https://app-b.example
  commit-sha: replace-with-40-character-git-sha
  application-image-digest: sha256:replace-with-64-hex-digest
  pilot-observer-image-digest: sha256:replace-with-64-hex-digest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ailaoda-pilot-ai-daily-review
data:
  reviewer: replace-with-ai-governance-reviewer
  # Fail closed until the daily reviewer explicitly confirms all four values.
  budget-breaches: "1"
  privacy-incidents: "1"
  cross-tenant-leaks: "1"
  unresolved-ai-incidents: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ailaoda-pilot-evidence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
