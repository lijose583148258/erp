apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ailaoda-app
  labels:
    app: ailaoda-app
spec:
  selector:
    matchLabels:
      app: ailaoda-app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: ailaoda-metrics-token
          key: token
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ailaoda-enterprise
  labels:
    app: ailaoda-app
spec:
  groups:
    - name: ailaoda.availability
      interval: 30s
      rules:
        - alert: AilaoDaMetricsTargetsMissing
          expr: absent(up{service="ailaoda-app"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: AilaoDa has no discoverable metrics targets
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaApplicationReplicaUnavailable
          expr: sum by (namespace) (up{service="ailaoda-app"} == 1) < 2
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Fewer than two AilaoDa application replicas are scrapeable
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaDeploymentReplicaUnavailable
          expr: kube_deployment_status_replicas_available{deployment="ailaoda-app"} < 2
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: AilaoDa deployment cannot tolerate another pod loss
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{container="app"}[15m]) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AilaoDa application container is restarting repeatedly
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

    - name: ailaoda.slo
      interval: 30s
      rules:
        - alert: AilaoDaHighServerErrorRate
          expr: |
            sum(rate(ailaoda_http_errors_total[5m]))
            /
            clamp_min(sum(rate(ailaoda_http_requests_total[5m])), 0.001)
            > 0.02
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: AilaoDa HTTP 5xx ratio exceeds 2 percent
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaHighAverageLatency
          expr: |
            sum(rate(ailaoda_http_request_duration_ms_sum[5m]))
            /
            clamp_min(sum(rate(ailaoda_http_requests_total[5m])), 0.001)
            > 750
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AilaoDa average server latency exceeds 750 ms
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaPoorBrowserVitals
          expr: sum(increase(ailaoda_browser_web_vitals_total{rating="poor"}[15m])) >= 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Browser clients are reporting sustained poor Web Vitals
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

    - name: ailaoda.dependencies
      interval: 30s
      rules:
        - alert: AilaoDaTelemetryDisabled
          expr: ailaoda_telemetry_configured == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OTLP trace export is disabled on an application instance
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaTelemetryDroppingSpans
          expr: increase(ailaoda_telemetry_spans_dropped_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: AilaoDa is dropping telemetry spans
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaTelemetryQueueNearCapacity
          expr: ailaoda_telemetry_queue_size > 4000
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: AilaoDa telemetry queue is near its default capacity
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaCacheErrors
          expr: increase(ailaoda_cache_operations_total{action=~"error|deserialize_error"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Shared cache operations are failing
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaObjectStorageWriteFailure
          expr: increase(ailaoda_storage_operations_total{action="write_error"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Object storage cannot satisfy the configured write quorum
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaObjectStorageReplicaDegraded
          expr: increase(ailaoda_storage_operations_total{action="write_partial"}[10m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Object storage writes are succeeding on only part of the configured endpoints
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaObjectStorageReadFailure
          expr: increase(ailaoda_storage_operations_total{action="read_error"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Object storage reads fail across every configured endpoint
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaObjectStorageFallbackSustained
          expr: sum(rate(ailaoda_storage_operations_total{action="read_fallback"}[10m])) > 0.02
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Object storage is continuously reading from a fallback endpoint
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaSearchIndexErrors
          expr: increase(ailaoda_search_operations_total{action="index_error"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Search indexing is failing
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaSearchFallbackSustained
          expr: sum(rate(ailaoda_search_operations_total{action="fallback"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Search is continuously falling back to the database
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

    - name: ailaoda.ai
      interval: 30s
      rules:
        - alert: AilaoDaAIGatewayFailures
          expr: |
            sum(increase(ailaoda_ai_operations_total{
              outcome=~"fallback_provider_error|fallback_budget_store_unavailable"
            }[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Governed AI gateway or budget store is failing
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaAICircuitOpen
          expr: increase(ailaoda_ai_operations_total{outcome="fallback_circuit_open"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Governed AI circuit breaker has opened
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaAIBudgetExhausted
          expr: increase(ailaoda_ai_operations_total{outcome="fallback_budget_exhausted"}[15m]) > 0
          for: 1m
          labels:
            severity: info
          annotations:
            summary: AI daily token budget is exhausted and local fallback is active
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md

        - alert: AilaoDaAIRateLimitPressure
          expr: sum(increase(ailaoda_ai_operations_total{outcome="rate_limited"}[10m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AI requests are repeatedly hitting the shared rate limit
            runbook: ops/production/kubernetes/OBSERVABILITY_RUNBOOK.md
