apiVersion: v1
kind: ServiceAccount
metadata:
  name: ailaoda-cnpg-receipt
  namespace: replace-with-control-namespace
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailaoda-cnpg-receipt
  namespace: replace-with-control-namespace
  labels:
    app.kubernetes.io/name: ailaoda-cnpg-receipt
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ailaoda-cnpg-receipt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ailaoda-cnpg-receipt
    spec:
      serviceAccountName: ailaoda-cnpg-receipt
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: replace-with-erp-runtime-image@sha256:replace-with-64-hex-digest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/ops/production/kubernetes/receipt/cnpg-backup-receipt-service.cjs
          env:
            - name: CNPG_RECEIPT_PORT
              value: "8080"
            - name: CNPG_RECEIPT_DIR
              value: /var/lib/ailaoda-receipts
            - name: CNPG_RECEIPT_PUBLIC_KEY_FILE
              value: /run/receipt-verifier/public.pem
            - name: CNPG_RECEIPT_AUTH_TOKEN_FILE
              value: /run/receipt-verifier/auth-token
            - name: CNPG_RECEIPT_ISSUER
              value: replace-with-provider-control-plane-issuer
            - name: CNPG_RECEIPT_MAX_AGE_HOURS
              value: "24"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: verifier-credentials
              mountPath: /run/receipt-verifier
              readOnly: true
            - name: receipts
              mountPath: /var/lib/ailaoda-receipts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: verifier-credentials
          secret:
            secretName: ailaoda-cnpg-receipt-verifier
            defaultMode: 0400
        - name: receipts
          persistentVolumeClaim:
            claimName: replace-with-provider-signed-receipt-pvc
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ailaoda-cnpg-receipt
  namespace: replace-with-control-namespace
spec:
  selector:
    app.kubernetes.io/name: ailaoda-cnpg-receipt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ailaoda-cnpg-receipt
  namespace: replace-with-control-namespace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ailaoda-cnpg-receipt
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ailaoda-cnpg-receipt
  namespace: replace-with-control-namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ailaoda-cnpg-receipt
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              erp.ailaoda.io/formal-pilot: "true"
          podSelector:
            matchLabels:
              erp.ailaoda.io/admission-runner: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress: []
