apiVersion: v1
kind: ConfigMap
metadata:
  name: ailaoda-runtime
data:
  NODE_ENV: production
  AILAODA_DEPLOYMENT_MODE: saas
  AILAODA_PRISMA_PROVIDER: postgresql
  AILAODA_BLOCK_DEMO_CREDENTIALS: "true"
  PORT: "5001"
  SERVE_FRONTEND: "true"
  TRUST_PROXY: "true"
  FRONTEND_DIST_DIR: /app/dist
  AUTH_TOKEN_STORE_DRIVER: redis
  LOGIN_RATE_LIMIT_STORE: redis
  REALTIME_BUS_DRIVER: redis
  CACHE_DRIVER: redis
  FILE_STORAGE_DRIVER: s3
  S3_FORCE_PATH_STYLE: "true"
  S3_MIN_WRITE_SUCCESSES: "1"
  S3_REQUEST_TIMEOUT_MS: "3000"
  SEARCH_DRIVER: meilisearch
  SEARCH_REQUEST_TIMEOUT_MS: "3000"
  SEARCH_RESULT_CACHE_TTL_SECONDS: "5"
  AI_GATEWAY_EXTERNAL_ENABLED: "false"
  AI_GATEWAY_TIMEOUT_MS: "12000"
  AI_GATEWAY_MAX_TOKENS: "500"
  AI_DAILY_TOKEN_BUDGET: "50000"
  AI_BUDGET_KEY_PREFIX: "ailaoda:ai:budget:"
  AI_CIRCUIT_FAILURE_THRESHOLD: "5"
  AI_CIRCUIT_FAILURE_WINDOW_SECONDS: "300"
  AI_CIRCUIT_OPEN_SECONDS: "60"
  AI_CIRCUIT_KEY_PREFIX: "ailaoda:ai:circuit:"
  LOG_DIR: /data/logs
  BACKUP_DIR: /data/backups
  UPLOAD_DIR: /data/upload-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailaoda-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ailaoda-app
  template:
    metadata:
      labels:
        app: ailaoda-app
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ailaoda-app
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ailaoda-app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: ailaoda-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.invalid/ailaoda/erp-crm:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: ailaoda-runtime
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: database-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: jwt-secret } }
            - name: REDIS_SENTINELS
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: redis-sentinels } }
            - name: REDIS_MASTER_NAME
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: redis-master-name } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: redis-password } }
            - name: S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-endpoint } }
            - name: S3_ENDPOINTS
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-fallback-endpoints } }
            - name: S3_REGION
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-region } }
            - name: S3_BUCKET
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-bucket } }
            - name: S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-access-key-id } }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: s3-secret-access-key } }
            - name: SEARCH_ENDPOINT
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: search-endpoint } }
            - name: SEARCH_ENDPOINTS
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: search-fallback-endpoints } }
            - name: MEILISEARCH_API_KEY
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: meilisearch-api-key } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: otel-endpoint } }
            - name: AILAODA_METRICS_BEARER_TOKEN_FILE
              value: /run/secrets/metrics/token
            - name: OTEL_SERVICE_NAME
              value: ailaoda-erp-crm
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: CORS_ORIGIN
              valueFrom: { secretKeyRef: { name: ailaoda-runtime-secrets, key: cors-origin } }
          volumeMounts:
            - name: metrics-token
              mountPath: /run/secrets/metrics
              readOnly: true
            - name: runtime-data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: metrics-token
          secret:
            secretName: ailaoda-metrics-token
        - name: runtime-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ailaoda-app
  labels:
    app: ailaoda-app
spec:
  selector: { app: ailaoda-app }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ailaoda-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ailaoda-app
